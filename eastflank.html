<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EastFlank — Operational Sandbox</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/milsymbol@2.2.0/dist/milsymbol.js"></script>
<style>
/* ───────── Tokens ───────── */
:root{--bg:#0a0b0e;--glass:rgba(32,34,40,.56);--edge:rgba(255,255,255,.09);--tx:#f5f5f7;--t2:rgba(235,235,245,.64);--t3:rgba(235,235,245,.38);
--bl:#0a84ff;--rd:#ff453a;--am:#ffb340;--ok:#32d74b;--fill:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
font:400 13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:.005em;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.cap{font-size:11px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--t2)}
.ttl{font-size:19px;line-height:1.15;font-weight:650;letter-spacing:-.022em}
.sub{font-size:12px;color:var(--t2);line-height:1.4}
#map{position:fixed;inset:0;background:#0d0f13}
.leaflet-tile-pane{filter:brightness(1.1) saturate(.8)}
.leaflet-container{font:inherit}
.leaflet-control-attribution{background:rgba(10,11,14,.55)!important;color:var(--t3)!important;backdrop-filter:blur(8px);border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--t2)!important}

/* ───────── Materials ───────── */
.glass{position:fixed;z-index:1100;background:var(--glass);border:1px solid var(--edge);border-radius:22px;
backdrop-filter:blur(var(--blur,28px)) saturate(1.8);-webkit-backdrop-filter:blur(var(--blur,28px)) saturate(1.8);
box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28),0 28px 72px rgba(0,0,0,.34)}
.sheet{visibility:hidden;will-change:transform,opacity;overflow:hidden;display:flex;flex-direction:column}
.sheet .grab{padding:18px 18px 12px;display:flex;gap:12px;align-items:flex-start;cursor:grab;touch-action:none;user-select:none;position:relative}
.sheet .grab:active{cursor:grabbing}
.sheet .grab::after{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.2)}
.sheet .body{overflow:auto;padding:4px 18px 18px;flex:1;mask-image:linear-gradient(#0000,#000 10px);-webkit-mask-image:linear-gradient(#0000,#000 10px)}
.x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--t2);display:grid;place-items:center;flex:none}
.x:active,.btn:active,.dk:active,.row:active,.seg button:active{transform:scale(.97);transition:transform 90ms ease-out}
.x:hover{background:rgba(255,255,255,.12)}
@media (prefers-reduced-transparency:reduce){.glass{background:#1c1d22!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
@media (prefers-contrast:more){.glass{background:#17181c!important;border-color:rgba(255,255,255,.5)}}

/* ───────── Brand + HUD ───────── */
#brand{left:16px;top:16px;height:48px;padding:0 18px 0 8px;display:flex;align-items:center;gap:10px;border-radius:24px;cursor:pointer}
#brand .lg{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2a8bff,#0a4fd1);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#brand b{font-size:15px;font-weight:650;letter-spacing:-.018em;display:block;line-height:1.1}
#brand small{font-size:11px;color:var(--t2);display:block;line-height:1.1;margin-top:2px}
#hud{right:16px;top:16px;display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
#hud button{width:44px;height:42px;display:grid;place-items:center;color:var(--t2)}
#hud button+button{border-top:1px solid var(--edge)}
#hud button:hover{color:var(--tx);background:var(--fill)}
#hud button:active{background:rgba(255,255,255,.14)}

/* ───────── Sidebar ───────── */
#side{left:16px;top:76px;bottom:16px;width:308px}
#side .grab{cursor:default}#side .grab::after{display:none}
.bal{margin:10px 0 2px}
.bal .bar{height:6px;border-radius:3px;background:var(--rd);overflow:hidden;margin-top:8px}
.bal .bar i{display:block;height:100%;background:var(--bl);width:50%;border-radius:3px 0 0 3px}
.bal .lg{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;font-weight:550}
.grp{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:0 4px}
.grp b{margin-left:auto;font-weight:500;color:var(--t3)}
.dot{width:8px;height:8px;border-radius:50%}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:12px}
.row:hover{background:var(--fill)}
.row.on{background:rgba(10,132,255,.2)}
.row.off{opacity:.45}
.row .ic{width:30px;height:24px;display:grid;place-items:center;flex:none}
.row .ic svg{max-width:30px;max-height:24px;width:auto;height:auto}
.row .rn{min-width:0;flex:1}.row .rn b{display:block;font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.row .rn i{font-style:normal;font-size:11.5px;color:var(--t2)}
.row .rr{font-size:12px;color:var(--t2)}
.foot{padding:12px 14px 14px;border-top:1px solid var(--edge)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border-radius:13px;background:var(--fill);font-weight:590;font-size:13.5px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:var(--bl);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(10,132,255,.35)}
.btn.pri:hover{background:#2b95ff}

/* ───────── Dock ───────── */
#dock{left:0;right:0;margin:0 auto;bottom:max(22px,env(safe-area-inset-bottom));width:max-content;display:flex;gap:4px;padding:6px;border-radius:26px}
#lens{position:absolute;left:0;top:6px;bottom:6px;width:0;border-radius:20px;background:rgba(255,255,255,.11);opacity:0;transition:opacity .2s;pointer-events:none}
.dk{position:relative;display:flex;align-items:center;gap:9px;height:46px;padding:0 20px 0 16px;border-radius:20px;font-weight:590;font-size:14px;letter-spacing:-.008em;white-space:nowrap}
.dk svg{color:var(--t2);transition:color .2s}
.dk.on svg{color:var(--bl)}
.dk .tag{font-size:11px;font-weight:600;color:var(--bl);background:rgba(10,132,255,.18);padding:2px 7px;border-radius:8px}
#catalog{left:0;right:0;margin:0 auto;bottom:100px;width:min(440px,calc(100% - 32px));transform-origin:20% 100%}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;height:28px;border-radius:9px;font-size:12px;font-weight:550;color:var(--t2);padding:0 8px;transition:background .18s,color .18s}
.seg button.on{background:rgba(255,255,255,.16);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:16px;background:var(--fill);font-size:12px;font-weight:550;text-align:center}
.tile:hover{background:rgba(255,255,255,.12)}
.tile svg{height:44px;width:auto;max-width:70px}
#chip{top:16px;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;font-weight:550}
#chip .btn{width:auto;height:30px;padding:0 14px;border-radius:15px}
#toast{left:0;right:0;margin:0 auto;bottom:96px;width:max-content;max-width:calc(100% - 32px);padding:10px 12px 10px 18px;border-radius:20px;display:flex;gap:16px;align-items:center;font-weight:550}
#toast .btn{width:auto;height:28px;padding:0 12px;color:var(--bl);border-radius:14px}

/* ───────── Inspector ───────── */
#insp{right:16px;top:76px;bottom:16px;width:348px}
.hd{display:flex;gap:12px;align-items:center;min-width:0}
.hd .sy{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,.28);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--edge)}
.hd .sy svg{max-width:44px;max-height:44px;width:auto;height:auto}
.badge{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:7px;margin-right:6px;vertical-align:1px}
.badge.B{background:rgba(10,132,255,.22);color:#6cb4ff}.badge.R{background:rgba(255,69,58,.22);color:#ff8b83}.badge.h{background:rgba(255,179,64,.2);color:var(--am)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.stat{background:var(--fill);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:21px;font-weight:620;letter-spacing:-.025em;line-height:1.2;margin-top:2px}
.stat .cap{font-size:10px}
.sec{margin:16px 0 8px}
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0}
.eq b{font-weight:550}.eq span{text-align:right;font-weight:600}
.eq i{grid-column:1/3;height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin-bottom:6px}
.eq i u{display:block;height:100%;border-radius:2px;text-decoration:none}
.rd{display:flex;align-items:baseline;justify-content:space-between}
.rd b{font-size:28px;font-weight:620;letter-spacing:-.03em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;outline:0;margin-top:4px;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c) var(--v),rgba(255,255,255,.14) var(--v))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 1px 1px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.45);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
.line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--edge)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.18);transition:background .22s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{transform:translateX(18px)}
.danger{color:var(--rd)}
.swap{animation:sw .26s ease-out}@keyframes sw{from{opacity:.0;transform:translateY(4px)}}

/* ───────── Sim sheet ───────── */
#scrim{position:fixed;inset:0;z-index:1090;background:#000;opacity:0;pointer-events:none}
#sim{left:0;right:0;margin:0 auto;bottom:100px;width:min(760px,calc(100% - 32px));max-height:calc(100% - 130px);transform-origin:50% 100%}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.ctls .cap{display:block;margin-bottom:6px;font-size:10.5px}
.out{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:14px}
@media(max-width:640px){.out{grid-template-columns:1fr}}
.card{background:var(--fill);border-radius:18px;padding:16px}
.big{font-size:52px;font-weight:600;letter-spacing:-.045em;line-height:1;margin:6px 0 4px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--edge);font-size:12.5px}
.kv span{color:var(--t2)}.kv b{font-weight:600}
.hl{font-size:15px;font-weight:620;letter-spacing:-.012em;margin-top:2px}
.lines{width:100%;height:auto;margin-top:8px;overflow:visible}
.leg{display:flex;gap:14px;font-size:11.5px;color:var(--t2);margin-top:6px}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.empty{padding:34px 10px;text-align:center;color:var(--t2)}
.fine{font-size:11px;color:var(--t3);margin-top:12px;line-height:1.4}

/* ───────── Map markers ───────── */
.u-wrap{background:none;border:0}
.mk{position:relative;will-change:transform;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)) drop-shadow(0 6px 12px rgba(0,0,0,.35));cursor:grab;transform-origin:50% 90%}
.mk svg{display:block;overflow:visible}
.mk .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:8px;background:rgba(14,15,18,.72);backdrop-filter:blur(8px);color:#fff;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.mk::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid transparent;transition:border-color .2s,box-shadow .2s;pointer-events:none}
.sel .mk::before{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 6px rgba(255,255,255,.12),0 0 24px rgba(255,255,255,.25)}
.off .mk{opacity:.4}
.placing .leaflet-container,.placing .leaflet-grab{cursor:crosshair}
.gt{background:rgba(255,179,64,.16)!important;border:1px solid rgba(255,179,64,.4)!important;color:var(--am)!important;font-weight:600;font-size:11px;border-radius:9px!important;box-shadow:none!important;padding:2px 8px!important;backdrop-filter:blur(8px)}
.gt::before{display:none}
@media(max-width:820px){#side{width:calc(100% - 32px)}#insp{width:calc(100% - 32px)}.dk span.t{display:none}.dk{padding:0 16px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="scrim"></div>

<div id="brand" class="glass" title="Toggle Order of Battle">
  <div class="lg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5l8 4 8-4v15"/><path d="M4 12l8 4 8-4"/></svg></div>
  <div><b>EastFlank</b><small id="posture">Garrison posture</small><small id="githubStatus" hidden></small></div>
</div>

<div id="hud" class="glass">
  <button id="zi" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zo" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button id="zg" aria-label="Centre on Suwałki Gap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>

<aside id="side" class="glass sheet">
  <div class="grab">
    <div style="flex:1">
      <div class="ttl">Order of Battle</div>
      <div class="sub" id="oobsub"></div>
      <div class="bal"><div class="lg" style="margin:0"><span class="cap">Effective combat power</span></div>
        <div class="bar"><i id="balbar"></i></div>
        <div class="lg num"><span style="color:#6cb4ff" id="balB"></span><span style="color:#ff8b83" id="balR"></span></div></div>
    </div>
  </div>
  <div class="body" id="list" style="padding-top:0"></div>
  <div class="foot"><button class="btn pri" id="scBtn2">Load Suwałki 2026 Scenario</button></div>
</aside>

<div id="chip" class="glass sheet"><span id="chipT"></span><button class="btn" id="chipX">Done</button></div>

<div id="catalog" class="glass sheet">
  <div class="grab"><div style="flex:1"><div class="ttl" style="font-size:17px">Place Unit</div><div class="sub">Choose a formation, then click the map. Drag to reposition.</div></div></div>
  <div class="body"><div class="seg" id="facSeg"><button data-f="B" class="on">NATO / Allied</button><button data-f="R">Russia / Belarus</button></div><div class="tiles" id="tiles"></div></div>
</div>

<section id="insp" class="glass sheet">
  <div class="grab"><div class="hd" id="ihd" style="flex:1"></div><button class="x" id="ix" aria-label="Close"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="body" id="ibody"></div>
</section>

<section id="sim" class="glass sheet">
  <div class="grab"><div style="flex:1"><div class="ttl">Operational Combat Estimate</div><div class="sub">Lanchester square-law attrition over committed formations</div></div><button class="x" id="sx" aria-label="Close"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="body"><div class="ctls" id="ctls"></div><div id="simOut"></div></div>
</section>

<div id="toast" class="glass sheet"><span id="toastT"></span><button class="btn" id="toastU">Undo</button></div>

<nav id="dock" class="glass">
  <i id="lens"></i>
  <button class="dk" data-a="place"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><path d="M12 7.5v5M9.5 10h5"/></svg><span class="t">Place Unit</span></button>
  <button class="dk" data-a="scen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4M4 5h12l-2 4 2 4H4"/></svg><span class="t" id="scT">Suwałki Scenario</span></button>
  <button class="dk" data-a="sim"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg><span class="t">Run Combat Simulation</span></button>
</nav>

<script>
/* ════════════════════════════════════════════════════════════════
   1 · SPRING ENGINE — damping ratio + response (Apple-style), velocity-aware,
       always animates from the live value so every motion is interruptible.
   ════════════════════════════════════════════════════════════════ */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s), fmt = n => Math.round(n).toLocaleString('en-US');
const live = new Set(); let raf = 0, last = 0;
class Spring {
  constructor(x, o = {}) { this.x = this.t = x; this.v = 0; this.r = o.r ?? .4; this.z = o.z ?? 1; this.e = o.e ?? .001; this.cb = null; }
  to(t, o = {}) {
    if (RM) return this.set(t);
    this.t = t; if (o.v != null) this.v = o.v; if (o.r) this.r = o.r; if (o.z != null) this.z = o.z;
    live.add(this); if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  set(x) { this.x = this.t = x; this.v = 0; live.delete(this); this.cb && this.cb(x); }
  hold() { live.delete(this); }
  step(dt) {
    const k = (2 * Math.PI / this.r) ** 2, c = 4 * Math.PI * this.z / this.r, n = Math.ceil(dt * 240), h = dt / n;
    for (let i = 0; i < n; i++) { this.v += (-k * (this.x - this.t) - c * this.v) * h; this.x += this.v * h; }
    if (Math.abs(this.x - this.t) < this.e && Math.abs(this.v) < this.e * 10) { this.x = this.t; this.v = 0; live.delete(this); }
  }
}
function tick(t) {
  const dt = Math.min((t - last) / 1000, .05); last = t;
  for (const s of [...live]) { s.step(dt); s.cb && s.cb(s.x); }
  raf = live.size ? requestAnimationFrame(tick) : 0;
}
const project = (v, d = .998) => (v / 1000) * d / (1 - d);                       // momentum projection (px)
const rubber = (o, dim = 1, c = .55) => (o * dim * c) / (dim + c * Math.abs(o));  // soft boundary

/* Sheet: materialises (blur + scale + slide together), draggable 1:1, velocity hand-off,
   flick projection decides dismiss, rubber-bands past its open edge, enters/exits on the same path. */
class Sheet {
  constructor(el, { axis = 'x', dir = 1, size, grab = '.grab', onChange } = {}) {
    Object.assign(this, { el, axis, dir, onChange }); this.size = size || (() => axis === 'x' ? el.offsetWidth : el.offsetHeight);
    this.open = false; this.p = new Spring(0, { r: .34, z: .82, e: .0005 }); this.p.cb = v => this.draw(v); this.draw(0);
    const g = grab && el.querySelector(grab); if (g) g.addEventListener('pointerdown', e => this.down(e));
  }
  draw(p) {
    const q = Math.max(0, Math.min(1, p)), o = (1 - p) * this.dir * (this.size() + 36);
    this.el.style.transform = `translate3d(${this.axis === 'x' ? o : 0}px,${this.axis === 'y' ? o : 0}px,0) scale(${.955 + .045 * Math.min(p, 1.04)})`;
    this.el.style.opacity = Math.min(1, q * 1.7); this.el.style.setProperty('--blur', 30 * q + 'px');
    this.el.style.visibility = p < .004 && !this.drag ? 'hidden' : 'visible';
    this.onChange && this.onChange(p);
  }
  show() { this.open = true; this.p.to(1, { z: .82 }); }
  hide() { this.open = false; this.p.to(0, { z: 1 }); }       // critically damped on exit — no overshoot on a non-momentum close
  down(e) {
    if (e.target.closest('button,input')) return;
    const h = e.currentTarget, P = this.axis === 'x' ? 'clientX' : 'clientY';
    h.setPointerCapture(e.pointerId); this.p.hold(); this.drag = true;
    const s0 = e[P], base = this.p.x, hist = [[e.timeStamp, e[P]]], sz = this.size();
    const mv = ev => {
      hist.push([ev.timeStamp, ev[P]]); while (hist.length > 2 && ev.timeStamp - hist[0][0] > 100) hist.shift();
      const raw = base - ((ev[P] - s0) * this.dir) / sz;

    };

      h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      this.drag = false; const a = hist[0], b = hist[hist.length - 1], dt = Math.max(b[0] - a[0], 1);
      const vpx = ((b[1] - a[1]) / dt) * 1000 * this.dir, dp = -vpx / sz;        // px/s → sheet-units/s
      const end = this.p.x - project(vpx) / sz, close = end < .5;
      this.open = !close; this.p.to(close ? 0 : 1, { v: dp, z: .8 }); this.onClose && close && this.onClose();
    };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  }
}

function force() {
  const o = { B: 0, R: 0, nB: 0, nR: 0 };
  act().forEach(u => { if (u.c !== false) { o[u.fac] += eff(u); o['n' + u.fac]++; } });
  return o;
}

  $('#ibody').innerHTML = `<div class="swap">
    <div class="sub num" style="margin:-2px 0 12px">${t.name} · ${u.bn} · ${u.sx.x.toFixed(2)}°N ${u.sy.x.toFixed(2)}°E</div>
    <div class="stats"><div class="stat"><span class="cap">Personnel</span><b class="num">${fmt(u.pers)}</b></div><div class="stat"><span class="cap">Combat pwr</span><b class="num">${u.cp}</b></div><div class="stat"><span class="cap">Effective</span><b class="num" id="effv">${eff(u).toFixed(0)}</b></div></div>
    <div class="cap sec">Equipment</div>
    ${Object.entries(u.eq).map(([k, v]) => `<div class="eq"><b>${k}</b><span class="num">${fmt(v)}</span><i><u style="width:${v / mx * 100}%;background:${c}"></u></i></div>`).join('')}
    <div class="cap sec">Readiness</div>
    <div class="rd"><b class="num" id="rv">${u.r}%</b><span class="sub" id="rl"></span></div>
    <input type="range" id="rs" min="10" max="100" value="${u.r}" style="--c:${c};--v:${(u.r - 10) / 90 * 100}%">
    <div class="line" style="margin-top:12px"><div><b style="font-weight:550">Committed to simulation</b><div class="sub">Include in combat estimate</div></div><label class="sw"><input type="checkbox" id="cm" ${u.c === false ? '' : 'checked'}><i></i></label></div>
    <div class="line"><button class="danger" id="rm" style="font-weight:550">Remove from map</button></div></div>`;
  const rl = v => v >= 85 ? 'Fully mission capable' : v >= 65 ? 'Degraded — limited sustainment' : 'Low — reconstitution required';
  $('#rl').textContent = rl(u.r);
  $('#rs').oninput = e => { u.r = +e.target.value; e.target.style.setProperty('--v', (u.r - 10) / 90 * 100 + '%'); $('#rv').textContent = u.r + '%'; $('#effv').textContent = eff(u).toFixed(0); $('#rl').textContent = rl(u.r); label(u); refresh(); };
  $('#cm').onchange = e => { u.c = e.target.checked; u.m.getElement().classList.toggle('off', !u.c); refresh(); };
  $('#rm').onclick = () => { const i = OOB.indexOf(u); OOB.splice(i, 1); unmount(u); insp.hide(); sel = null; refresh(); toast(`${u.short} removed`, () => { OOB.splice(i, 0, u); mount(u); refresh(); }); };
  insp.show(); refresh();
}

/* ════════════════════════════════════════════════════════════════
   7 · OPERATIONAL COMBAT ENGINE — Lanchester square law
        dB/dt = −ρ·fR·R     dR/dt = −ρ·fB·B      (f = terrain/air/warning-adjusted effectiveness)
   ════════════════════════════════════════════════════════════════ */
const S = { att: 'R', ter: 'marsh', warn: 1, air: 'c' };
const CTL = [
  ['Attacker', 'att', [['R', 'Russia'], ['B', 'NATO']]],
  ['Terrain (defender bonus)', 'ter', [['open', 'Open'], ['forest', 'Forest'], ['marsh', 'Marsh'], ['urban', 'Urban']]],
  ['NATO warning time', 'warn', [[0, 'None'], [1, '2 days'], [2, '5 days']]],
  ['Air superiority', 'air', [['B', 'NATO'], ['c', 'Contested'], ['R', 'Russia']]],
];
function buildCtls() {
  $('#ctls').innerHTML = CTL.map(([l, k, o]) => `<div><span class="cap">${l}</span><div class="seg" data-k="${k}">${o.map(([v, t]) => `<button data-v="${v}" class="${S[k] == v ? 'on' : ''}">${t}</button>`).join('')}</div></div>`).join('');
  $('#ctls').querySelectorAll('.seg').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = sg.dataset.k; S[k] = typeof S[k] === 'number' ? +b.dataset.v : b.dataset.v;
    sg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); runSim();
  }));
}
function simulate() {
  const f = force(); if (!f.nB || !f.nR) return null;
  const T = { open: 1, forest: 1.12, marsh: 1.28, urban: 1.38 }[S.ter], air = { B: [1.1, .92], c: [1, 1], R: [.92, 1.1] }[S.air];
  const b0 = f.B * (1 + [0, .06, .12][S.warn]) * air[0], r0 = f.R * air[1];
  const fb = S.att === 'R' ? T : 1, fr = S.att === 'B' ? T : 1, rho = .045, dt = .1;
  let b = b0, r = r0, t = 0, pts = [[0, 100, 100]], end = 'stalemate';
  while (t < 30) {
    const nb = Math.max(0, b - rho * fr * r * dt), nr = Math.max(0, r - rho * fb * b * dt); b = nb; r = nr; t += dt;
    if (Math.round(t * 10) % 5 === 0) pts.push([t, 100 * b / b0, 100 * r / r0]);
    const at = S.att === 'B' ? b / b0 : r / r0, df = S.att === 'B' ? r / r0 : b / b0;
    if (at < .65) { end = 'culminates'; break; } if (df < .35) { end = 'collapses'; break; }
  }
  pts.push([t, 100 * b / b0, 100 * r / r0]);
  const x = (fb * b0 * b0) / (fr * r0 * r0), p = x ** 1.2 / (1 + x ** 1.2);
  return { b0, r0, b: 100 * b / b0, r: 100 * r / r0, t, end, pts, p, ratio: r0 / b0, T, f };
}
const chartP = new Spring(0, { r: .9, z: 1, e: 1e-3 });
function runSim() {
  const o = simulate(), el = $('#simOut');
  if (!o) { el.innerHTML = `<div class="card empty"><div class="hl" style="color:var(--tx)">Both sides needed</div>Commit at least one formation per side — or load the Suwałki 2026 scenario.</div>`; return; }
  const holds = S.att === 'R' ? o.end === 'culminates' : o.end === 'collapses', bw = o.p >= .5;
  const head = o.end === 'stalemate' ? 'Stalemate — no decisive result' : S.att === 'R' ? (o.end === 'culminates' ? 'NATO holds · Russian attack culminates' : 'Defence collapses · Russian breakthrough') : (o.end === 'culminates' ? 'Russia holds · NATO counter-attack culminates' : 'Russian defence collapses · NATO breakthrough');
  const col = o.end === 'stalemate' ? 'var(--am)' : (S.att === 'R' ? (o.end === 'culminates' ? 'var(--bl)' : 'var(--rd)') : (o.end === 'culminates' ? 'var(--rd)' : 'var(--bl)'));
  const W = 300, H = 120, mx = Math.max(o.t, 4), path = i => o.pts.map((p, k) => `${k ? 'L' : 'M'}${(p[0] / mx * W).toFixed(1)},${(H - p[i] / 100 * H).toFixed(1)}`).join('');
  el.innerHTML = `<div class="out">
    <div class="card"><span class="cap">NATO advantage probability</span><div class="big num" style="color:${bw ? 'var(--bl)' : 'var(--rd)'}">${Math.round(o.p * 100)}%</div><div class="hl" style="color:${col}">${head}</div>
      <div style="margin-top:12px"><div class="kv"><span>Force ratio (RU : NATO)</span><b class="num">${o.ratio.toFixed(2)} : 1</b></div>
      <div class="kv"><span>Defender terrain factor</span><b class="num">×${o.T.toFixed(2)}</b></div>
      <div class="kv"><span>NATO remaining</span><b class="num" style="color:#6cb4ff">${o.b.toFixed(0)}%</b></div>
      <div class="kv"><span>Russia / Belarus remaining</span><b class="num" style="color:#ff8b83">${o.r.toFixed(0)}%</b></div>
      <div class="kv"><span>Decision point</span><b class="num">${o.end === 'stalemate' ? '> 30 days' : 'Day ' + o.t.toFixed(1)}</b></div></div></div>
    <div class="card"><span class="cap">Projected attrition (% of starting strength)</span>
      <svg class="lines" viewBox="0 0 ${W} ${H + 18}"><defs><clipPath id="cp"><rect id="cpr" x="-4" y="-6" width="0" height="${H + 30}"/></clipPath></defs>
        ${[0, 50, 100].map(v => `<line x1="0" x2="${W}" y1="${H - v * H / 100}" y2="${H - v * H / 100}" stroke="rgba(255,255,255,.08)"/><text x="${W + 0}" y="${H - v * H / 100 - 3}" text-anchor="end" fill="rgba(235,235,245,.4)" font-size="8.5">${v}%</text>`).join('')}
        <g clip-path="url(#cp)"><path d="${path(1)}" fill="none" stroke="var(--bl)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${path(2)}" fill="none" stroke="var(--rd)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
        <text x="0" y="${H + 14}" fill="rgba(235,235,245,.5)" font-size="9">Day 0</text><text x="${W}" y="${H + 14}" text-anchor="end" fill="rgba(235,235,245,.5)" font-size="9">Day ${mx.toFixed(0)}</text></svg>
      <div class="leg"><span><i style="background:var(--bl)"></i>NATO / Allied (${o.f.nB})</span><span><i style="background:var(--rd)"></i>Russia / Belarus (${o.f.nR})</span></div></div></div>
    <p class="fine">A deliberately simplified operational model on illustrative order-of-battle data — not a forecast. Real outcomes hinge on logistics, EW, air power, C2 and political decisions that are not modelled here.</p>`;
  chartP.cb = v => { const r = $('#cpr'); r && r.setAttribute('width', v * (W + 12)); }; chartP.set(0); chartP.to(1);   // line draws in on a spring
}
function toggleSim() { sim.open ? closeSim() : openSim(); }
function openSim() { if (cat.open) { cat.hide(); } if (armed) disarm(); setOn('place', false); buildCtls(); runSim(); sim.show(); setOn('sim', true); }
function closeSim() { sim.hide(); setOn('sim', false); }
sim.onClose = () => setOn('sim', false);

/* ── Keyboard: Esc backs out of whatever is on top ── */
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (armed) disarm(); else if (sim.open) closeSim(); else if (cat.open) { cat.hide(); setOn('place', false); } else if (insp.open) $('#ix').click(); });

const BUILD_SHA = '__BUILD_SHA__';
if (!BUILD_SHA.startsWith('__')) {
  const githubStatus = $('#githubStatus');
  const checkForDeployment = async () => {
    try {
      const response = await fetch(`./version.json?check=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) return;
      const deployment = await response.json();
      githubStatus.hidden = false;
      if (deployment.sha !== BUILD_SHA) {
        githubStatus.textContent = 'Update found · reloading';
        location.replace(`./?v=${encodeURIComponent(deployment.sha)}`);
      } else {
        githubStatus.textContent = 'GitHub live';
      }
    } catch {}
  };
  checkForDeployment();
  setInterval(checkForDeployment, 15000);
}

refresh();
</script>
